[package]
name = "aalo"
version = "0.1.0"
edition = "2024"
categories = ["asynchronous", "gui", "game-development"]
description = "aka bevy-inspector-haalka, a bevy_ui-native inspector for Bevy"
exclude = [".github/"]
keywords = ["bevy", "inspector", "ui", "gamedev", "signals"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databasedav/aalo"
documentation = "https://docs.rs/aalo"

[dependencies]
bevy_app = "0.16"
bevy_asset = "0.16"
bevy_color = "0.16"
bevy_core_pipeline = "0.16"
bevy_derive = "0.16"
bevy_ecs = "0.16"
bevy_image = "0.16"
bevy_input = "0.16"
bevy_log = "0.16"
bevy_math = "0.16"
bevy_picking = "0.16"
bevy_reflect = "0.16"
bevy_render = "0.16"
bevy_sprite = "0.16"
bevy_tasks = "0.16"
bevy_text = { version = "0.16", features = ["default_font"] }
bevy_time = "0.16"
bevy_transform = "0.16"
bevy_ui = "0.16"
bevy_utils = "0.16"
bevy_window = "0.16"
bevy_input_focus = "0.16"
cfg-if = "1.0"
haalka = "0.5"
disqualified = "1.0"
paste = "1.0"
nucleo-matcher = "0.3"
strum = { version = "0.27", features = ["derive"] }
num = "0.4"
bevy_rich_text3d = { version = "0.4", default-features = false, features = ["2d"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator"] }

[features]
deployed_wasm_example = []

debug = ["haalka/debug"]

[dev-dependencies]
bevy = "0.16"

[[example]]
name = "custom"
path = "examples/custom.rs"
doc-scrape-examples = true

[[example]]
name = "world"
path = "examples/world.rs"
doc-scrape-examples = true

[[example]]
name = "utils"
path = "examples/utils.rs"
doc-scrape-examples = true
crate-type = ["lib"]
